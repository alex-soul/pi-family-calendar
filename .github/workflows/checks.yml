name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mosquitto
          python3 -m venv /tmp/calendar-host-tests
          /tmp/calendar-host-tests/bin/pip install -r host/requirements.txt
          cd host
          /tmp/calendar-host-tests/bin/python -m unittest discover -s . -p 'test_*.py' -v
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Packaged HTTP smoke
        shell: bash
        run: |
          npm start > /tmp/calendar-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/healthz >/dev/null; then break; fi
            sleep 1
          done
          node scripts/smoke.mjs http://127.0.0.1:3000
          node scripts/admin-smoke.mjs http://127.0.0.1:3000 --disposable
          node scripts/qr-smoke.mjs http://127.0.0.1:3000 --disposable
