name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Packaged HTTP smoke
        shell: bash
        run: |
          npm start > /tmp/calendar-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/healthz >/dev/null; then break; fi
            sleep 1
          done
          node scripts/smoke.mjs http://127.0.0.1:3000
